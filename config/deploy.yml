# Name of your application. Used to uniquely configure containers.
service: openrangedevs

# Name of the container image.
image: ord/openrangedevs

# Retain only the last 3 container versions for rollback purposes
retain_containers: 3

# Deploy to these servers.
servers:
  web:
    - 137.184.163.211

# Enable SSL auto certification via Let's Encrypt and allow for multiple
# apps on a single web server.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to
# "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  forward_headers: true
  hosts:
    - openrangedevs.com
    - www.openrangedevs.com
  app_port: 80

# Credentials for your image host.
registry:
  server: registry.digitalocean.com
  username: arnold.roa@openrangedevs.com
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
# context: . builds from the working tree (needed until deploy files are
# committed; Kamal's default git clone ignores uncommitted files).
builder:
  arch: amd64
  remote: ssh://root@167.172.124.249
  context: .

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
